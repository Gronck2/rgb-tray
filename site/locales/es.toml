# Lists. In TOML every key after a [[table]] header belongs to that entry, so the lists come last.

# why
[[why]]
title = "Nada más en segundo plano"
text = "Ella misma habla el protocolo de cada dispositivo, así que G HUB, Synapse, Armoury Crate o SignalRGB no tienen que estar ejecutándose. La instalación no requiere derechos de administrador."
[[why]]
title = "Un único panel para todo"
text = "Un clic izquierdo en el icono de la bandeja abre el panel: color, efecto y brillo para todos los dispositivos a la vez o por dispositivo, y preajustes que puedes asignar a atajos de teclado globales."
[[why]]
title = "Sigue el ritmo de tu PC"
text = "La iluminación vuelve tras la suspensión (incluido Modern Standby) y al conectar un dispositivo, se atenúa con la pantalla y se apaga mientras la pantalla está apagada."

