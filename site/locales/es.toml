# features
[[features]]
title = "Brillo y velocidad"
text = "Un brillo global y, encima, uno por dispositivo; la velocidad de la respiración y del espectro, global y por dispositivo."
[[features]]
title = "Editor por tecla"
text = "Para el teclado Logitech: pincel, cuentagotas, arcoíris, degradado de dos colores, preajustes WASD y de solo letras, resaltado de una palabra, esquemas guardados, distribuciones ANSI e ISO."
[[features]]
title = "Preajustes con atajos de teclado"
text = "Guarda un aspecto y cámbiate a él con un atajo de teclado global, incluidas F13–F24 con Ctrl, Alt, Shift o Win."
[[features]]
title = "Un atajo por dispositivo"
text = "Apaga un dispositivo y lo vuelve a encender tal como estaba, por ejemplo una lámpara de la habitación. Los preajustes no se ven afectados."
[[features]]
title = "Sigue a la pantalla"
text = "Se atenúa cuando Windows atenúa la pantalla y se apaga mientras la pantalla está apagada: inactividad, bloqueo o suspensión. Se puede desactivar."
[[features]]
title = "Inalámbricos y batería"
text = "Niveles de batería, avisos al 10 % y al 5 %, y un estado “No link” mientras un dispositivo inalámbrico está en reposo; sus colores vuelven cuando despierta."
[[features]]
title = "Muchos dispositivos, cada uno aparte"
text = "Los dispositivos idénticos tienen sus propios ajustes, distinguidos por el número de serie. Los desconectados esperan en un archivo con sus ajustes."
[[features]]
title = "Comparte tu configuración"
text = "Exporta e importa todos los ajustes, o guarda un preajuste en un archivo: se aplica a los dispositivos de los mismos modelos de quien lo recibe."
[[features]]
title = "Actualizaciones con un clic"
text = "Una vez al día la aplicación consulta en GitHub la última versión y muestra una tarjeta que la instala. La comprobación se puede desactivar."
[[features]]
title = "Integrada en Windows"
text = "El icono de la bandeja muestra el color actual, el panel se puede fijar por encima de las demás ventanas, el tema sigue a Windows y la interfaz está en inglés o ruso."

