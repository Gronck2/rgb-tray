# limits
[[limits]]
head = "Solo Windows."
text = "Es una aplicación para Windows 10 y 11; no hay versión para macOS ni Linux."
[[limits]]
head = "Solo iluminación."
text = "Sin macros, reasignación de teclas, DPI del ratón ni actualizaciones de firmware."
[[limits]]
head = "No junto a las aplicaciones de iluminación del fabricante."
text = "Dos programas que escriben en el mismo dispositivo se estorban entre sí: cierra primero el software de iluminación de G HUB, Synapse, Armoury Crate, SignalRGB u OpenRGB."
[[limits]]
head = "Sin cuenta y sin nube."
text = "Solo se conecta a internet para la comprobación diaria de actualizaciones, que se puede desactivar, y a las bombillas Tuya de tu propia red."
[[limits]]
head = "No todos los modelos están probados."
text = "La mayoría de los modelos Razer salen de los datos de OpenRazer y están sin probar; los teclados inalámbricos HyperSpeed, por ahora, solo funcionan por cable."
[[limits]]
head = "Aún sin firma digital."
text = "Windows SmartScreen puede mostrar una advertencia sobre el instalador la primera vez; consulta Descarga e instalación más abajo."

# claude_steps
[[claude_steps]]
title = "Abre el repositorio en Claude Code"
text = "En el PC con Windows al que está conectado el dispositivo, clona <code>github.com/Gronck2/rgb-tray</code> e inicia Claude Code en esa carpeta. Para un perfil bastan las herramientas de línea de comandos de la aplicación instalada; un controlador necesita Rust, y Claude te ayuda a instalarlo."
[[claude_steps]]
title = "Escribe /add-device"
text = "Di de qué dispositivo se trata y qué se ilumina en él. Cierra antes la aplicación del fabricante, para que dos programas no se disputen el dispositivo."
[[claude_steps]]
title = "Claude lee el informe del dispositivo"
text = "Ejecuta <code>rgbtray --diagnose</code>, encuentra tu dispositivo por sus ids de fabricante y de producto y ve cuáles de sus interfaces hablan un protocolo que RGB Tray ya conoce."
[[claude_steps]]
title = "Encuentra el protocolo"
text = "En OpenRGB u OpenRazer, en una captura USB de la aplicación del fabricante que tú grabas (<a href=\"{{capture_doc_url}}\">cómo</a>), o con pruebas cuidadosas con <code>--hid-send</code>, de una en una y solo con tu visto bueno."
[[claude_steps]]
title = "Tú eres sus ojos"
text = "Escribe el perfil, lo comprueba con <code>--profile-check</code> y reproduce colores, zonas y efectos con <code>--profile-test</code>. Después de cada paso te pregunta qué hizo el dispositivo."
[[claude_steps]]
title = "Funciona en tu PC"
text = "Claude copia el perfil en <code>%APPDATA%\\rgbtray\\devices\\</code>; reinicia RGB Tray y el dispositivo tiene su tarjeta en el panel. Después te pregunta si quieres compartirlo."

# routes
[[routes]]
title = "Ya funciona"
text = "Los dispositivos HID LampArray y los teclados QMK con VIA los controlan controladores genéricos. Abre el panel y busca la tarjeta."
[[routes]]
title = "Un perfil para un protocolo conocido"
text = "Un modelo Razer nuevo es un pequeño archivo TOML con sus ids de producto, id de transacción e ids de LED, tomados de OpenRazer. Un perfil QMK/VIA puede nombrar los efectos del firmware."
[[routes]]
title = "Un perfil <code>[hid]</code>"
text = "Un protocolo sencillo, con informes que llevan el color dentro y sin necesidad de respuestas, se escribe como plantillas de informe con <code>{r} {g} {b}</code>. También admite sumas de verificación XOR o de suma, informes de «tomar el control» y «devolverlo», y colores por LED. Sin compilar."
[[routes]]
title = "Un controlador en Rust"
text = "Un protocolo que necesita respuestas, un handshake o estado es un controlador: un módulo que implementa el trait <code>Device</code>. <a href=\"{{contributing_url}}\">CONTRIBUTING.md</a> lo explica paso a paso."

# commands
[[commands]]
cmd = "rgbtray --diagnose report.txt"
text = "Todos los dispositivos e interfaces HID, con los que RGB Tray conoce marcados, y los archivos de perfil con errores."
[[commands]]
cmd = "rgbtray --hid-send out.txt <vid:pid[:page[:usage]]> <feature|output|get> \"<hex>\""
text = "Envía informes sin procesar y añade las respuestas al archivo, para descifrar un protocolo."
[[commands]]
cmd = "rgbtray --profile-check out.txt my-device.toml"
text = "Lee un perfil sin tocar ningún dispositivo y escribe qué entiende la aplicación de cada modelo, o qué tiene de incorrecto."
[[commands]]
cmd = "rgbtray --profile-test out.txt my-device.toml"
text = "Reproduce rojo, verde, azul, blanco tenue, cada zona, respiración, espectro y apagado en el dispositivo de un perfil <code>[hid]</code>, registrando cada paso."

# share_steps
[[share_steps]]
text = "El perfil va a <code>profiles/&lt;vendor&gt;-&lt;model&gt;.toml</code> y a <code>BUILT_IN</code> en <code>src/devices/profile.rs</code>, con <code>tested = true</code> solo si se comprobó en el dispositivo."
[[share_steps]]
text = "El dispositivo se añade a las tablas de todos los README."
[[share_steps]]
text = "Pasan las comprobaciones que ejecuta CI: <code>cargo fmt --check</code>, <code>cargo clippy</code> y <code>cargo test</code>."
[[share_steps]]
text = "Un pull request desde una rama de tu fork indica qué dispositivo, qué ruta y qué se comprobó en el hardware. ¿Prefieres no lidiar con git? Abre una solicitud de dispositivo y adjunta el perfil y el informe del dispositivo."

# install_steps
[[install_steps]]
text = "Descarga <code>RGBTray-Setup-&lt;version&gt;.exe</code> de la última versión."
[[install_steps]]
text = "Ejecútalo. Se instala solo para tu usuario de Windows en <code>%LOCALAPPDATA%\\Programs\\RGB Tray</code> y se inicia."
[[install_steps]]
text = "Haz clic en el icono de la bandeja para abrir el panel. RGB Tray se desinstala desde Configuración de Windows → Aplicaciones."
