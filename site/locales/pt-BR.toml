# features
[[features]]
title = "Brilho e velocidade"
text = "Um brilho global e, por cima dele, um por dispositivo; a velocidade da respiração e do espectro, global e por dispositivo."
[[features]]
title = "Editor por tecla"
text = "Para o teclado Logitech: pincel, conta-gotas, arco-íris, degradê de duas cores, predefinições WASD e só letras, destaque de uma palavra, esquemas salvos, layouts ANSI e ISO."
[[features]]
title = "Predefinições com atalhos"
text = "Salve um visual e troque para ele com um atalho de teclado global, incluindo F13–F24 com Ctrl, Alt, Shift ou Win."
[[features]]
title = "Um atalho por dispositivo"
text = "Desliga um dispositivo e o liga de novo como estava, por exemplo uma luminária do quarto. As predefinições não são afetadas."
[[features]]
title = "Acompanha a tela"
text = "Escurece quando o Windows escurece a tela e se apaga enquanto a tela está desligada: inatividade, bloqueio ou suspensão. Pode ser desativado."
[[features]]
title = "Sem fio e bateria"
text = "Níveis de bateria, alertas em 10% e 5%, e um status “No link” enquanto um dispositivo sem fio está em repouso; as cores voltam quando ele desperta."
[[features]]
title = "Vários dispositivos, cada um separado"
text = "Dispositivos idênticos têm configurações próprias, distinguidos pelo número de série. Os desconectados esperam em um arquivo com suas configurações."
[[features]]
title = "Compartilhe sua configuração"
text = "Exporte e importe todas as configurações, ou salve uma predefinição em um arquivo: ela é aplicada aos dispositivos dos mesmos modelos de quem a recebe."
[[features]]
title = "Atualizações com um clique"
text = "Uma vez por dia o aplicativo consulta o GitHub em busca da versão mais recente e mostra um card que a instala. A verificação pode ser desativada."
[[features]]
title = "Integrado ao Windows"
text = "O ícone da bandeja mostra a cor atual, o painel pode ser fixado por cima das outras janelas, o tema acompanha o Windows e a interface está em inglês ou russo."

