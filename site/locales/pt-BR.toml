models = "G915 TKL (receptor LIGHTSPEED)"
text = "Estático, respiração, espectro e desligado; cores por tecla com um editor de teclas; os efeitos de onda (wave) e ondulação (ripple) do firmware; bateria."
[[families]]
hue = "135"
