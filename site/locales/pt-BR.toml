# Lists. In TOML every key after a [[table]] header belongs to that entry, so the lists come last.

# why
[[why]]
title = "Mais nada em segundo plano"
text = "Ele mesmo fala o protocolo de cada dispositivo, então G HUB, Synapse, Armoury Crate ou SignalRGB não precisam estar rodando. A instalação não exige direitos de administrador."
[[why]]
title = "Um único painel para tudo"
text = "Um clique esquerdo no ícone da bandeja abre o painel: cor, efeito e brilho para todos os dispositivos de uma vez ou por dispositivo, e predefinições que você pode associar a atalhos de teclado globais."
[[why]]
title = "Acompanha o seu PC"
text = "A iluminação volta depois da suspensão (incluindo o Modern Standby) e quando um dispositivo é conectado, escurece junto com a tela e se apaga enquanto a tela está desligada."

# families
[[families]]
hue = "205"
