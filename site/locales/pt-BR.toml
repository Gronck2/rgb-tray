# limits
[[limits]]
head = "Só Windows."
text = "É um aplicativo para Windows 10 e 11; não existe versão para macOS nem Linux."
[[limits]]
head = "Só iluminação."
text = "Sem macros, remapeamento de teclas, DPI do mouse nem atualizações de firmware."
[[limits]]
head = "Não junto com os aplicativos de iluminação do fabricante."
text = "Dois programas escrevendo no mesmo dispositivo brigam entre si: feche antes o software de iluminação do G HUB, Synapse, Armoury Crate, SignalRGB ou OpenRGB."
[[limits]]
head = "Sem conta e sem nuvem."
text = "Ele só vai à internet para a verificação diária de atualizações, que pode ser desativada, e para as lâmpadas Tuya da sua própria rede."
[[limits]]
head = "Nem todos os modelos foram testados."
text = "A maioria dos modelos Razer vem dos dados do OpenRazer e não foi testada; teclados sem fio HyperSpeed, por enquanto, só funcionam no cabo."
[[limits]]
head = "Ainda sem assinatura de código."
text = "O Windows SmartScreen pode exibir um aviso sobre o instalador na primeira vez; veja Baixar e instalar abaixo."

# claude_steps
[[claude_steps]]
title = "Abra o repositório no Claude Code"
text = "No PC com Windows em que o dispositivo está conectado, clone <code>github.com/Gronck2/rgb-tray</code> e inicie o Claude Code nessa pasta. Para um perfil, bastam as ferramentas de linha de comando do aplicativo instalado; um driver precisa de Rust, e o Claude ajuda você a instalá-lo."
[[claude_steps]]
title = "Digite /add-device"
text = "Diga qual é o dispositivo e o que nele acende. Feche antes o aplicativo do fabricante, para que dois programas não briguem pelo dispositivo."
[[claude_steps]]
title = "O Claude lê o relatório do dispositivo"
text = "Ele executa <code>rgbtray --diagnose</code>, encontra o seu dispositivo pelos ids de fabricante e de produto e vê quais de suas interfaces falam um protocolo que o RGB Tray já conhece."
[[claude_steps]]
title = "Ele descobre o protocolo"
text = "No OpenRGB ou no OpenRazer, em uma captura USB do aplicativo do fabricante que você grava (<a href=\"{{capture_doc_url}}\">como</a>), ou com tentativas cuidadosas com <code>--hid-send</code>, uma de cada vez e só com o seu sim."
[[claude_steps]]
title = "Você é os olhos dele"
text = "Ele escreve o perfil, verifica com <code>--profile-check</code> e reproduz cores, zonas e efeitos com <code>--profile-test</code>. Depois de cada etapa, pergunta o que o dispositivo fez."
[[claude_steps]]
title = "Funciona no seu PC"
text = "O Claude copia o perfil para <code>%APPDATA%\\rgbtray\\devices\\</code>; reinicie o RGB Tray e o dispositivo ganha seu card no painel. Depois ele pergunta se você quer compartilhá-lo."

# routes
[[routes]]
title = "Já funciona"
text = "Dispositivos HID LampArray e teclados QMK com VIA são controlados por drivers genéricos. Abra o painel e procure o card."
[[routes]]
title = "Um perfil para um protocolo conhecido"
text = "Um novo modelo Razer é um pequeno arquivo TOML com seus ids de produto, id de transação e ids de LED, tirados do OpenRazer. Um perfil QMK/VIA pode nomear os efeitos do firmware."
[[routes]]
title = "Um perfil <code>[hid]</code>"
text = "Um protocolo simples, com relatórios que carregam a cor e sem necessidade de respostas, é escrito como modelos de relatório com <code>{r} {g} {b}</code>. Também aceita checksums XOR ou de soma, relatórios de “assumir o controle” e “devolver”, e cores por LED. Sem compilar."
[[routes]]
title = "Um driver em Rust"
text = "Um protocolo que precisa de respostas, de um handshake ou de estado é um driver: um módulo que implementa a trait <code>Device</code>. O <a href=\"{{contributing_url}}\">CONTRIBUTING.md</a> explica o passo a passo."

# commands
[[commands]]
cmd = "rgbtray --diagnose report.txt"
text = "Todos os dispositivos e interfaces HID, com os que o RGB Tray conhece marcados, e os arquivos de perfil com erros."
[[commands]]
cmd = "rgbtray --hid-send out.txt <vid:pid[:page[:usage]]> <feature|output|get> \"<hex>\""
text = "Envia relatórios brutos e acrescenta as respostas ao arquivo, para descobrir um protocolo."
[[commands]]
cmd = "rgbtray --profile-check out.txt my-device.toml"
text = "Lê um perfil sem acessar nenhum dispositivo e grava como o aplicativo interpreta cada modelo, ou o que há de errado com ele."
[[commands]]
cmd = "rgbtray --profile-test out.txt my-device.toml"
text = "Reproduz vermelho, verde, azul, branco fraco, cada zona, respiração, espectro e desligado no dispositivo de um perfil <code>[hid]</code>, registrando cada etapa."

# share_steps
[[share_steps]]
text = "O perfil vai para <code>profiles/&lt;vendor&gt;-&lt;model&gt;.toml</code> e para <code>BUILT_IN</code> em <code>src/devices/profile.rs</code>, com <code>tested = true</code> só se foi verificado no dispositivo."
[[share_steps]]
text = "O dispositivo entra nas tabelas de todos os README."
[[share_steps]]
text = "As verificações que o CI executa passam: <code>cargo fmt --check</code>, <code>cargo clippy</code> e <code>cargo test</code>."
[[share_steps]]
text = "Um pull request a partir de uma branch do seu fork diz qual dispositivo, qual caminho e o que foi verificado no hardware. Prefere não lidar com o git? Abra um pedido de dispositivo e anexe o perfil e o relatório do dispositivo."

# install_steps
[[install_steps]]
text = "Baixe <code>RGBTray-Setup-&lt;version&gt;.exe</code> da última versão."
[[install_steps]]
text = "Execute o arquivo. Ele se instala para o seu usuário do Windows em <code>%LOCALAPPDATA%\\Programs\\RGB Tray</code> e é iniciado."
[[install_steps]]
text = "Clique no ícone da bandeja para abrir o painel. O RGB Tray é removido em Configurações do Windows → Aplicativos."
