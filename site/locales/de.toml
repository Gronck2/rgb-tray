# Lists. In TOML every key after a [[table]] header belongs to that entry, so the lists come last.

# why
[[why]]
title = "Sonst nichts im Hintergrund"
text = "Es spricht das Protokoll jedes Geräts selbst, daher müssen G HUB, Synapse, Armoury Crate oder SignalRGB nicht laufen. Die Installation braucht keine Administratorrechte."
[[why]]
title = "Ein Panel für alles"
text = "Ein Linksklick auf das Tray-Symbol öffnet das Panel: Farbe, Effekt und Helligkeit für alle Geräte auf einmal oder pro Gerät, dazu Voreinstellungen, die Sie auf globale Tastenkürzel legen können."
[[why]]
title = "Es hält mit Ihrem PC Schritt"
text = "Die Beleuchtung kommt nach dem Ruhezustand (auch Modern Standby) und beim Anstecken eines Geräts zurück, wird mit dem Bildschirm gedimmt und geht aus, solange der Bildschirm aus ist."

