# features
[[features]]
title = "Helligkeit und Geschwindigkeit"
text = "Eine globale Helligkeit mit einer zusätzlichen pro Gerät; die Geschwindigkeit von Atmen und Spektrum, global und pro Gerät."
[[features]]
title = "Tasteneditor"
text = "Für die Logitech-Tastatur: Pinsel, Pipette, Regenbogen, Zweifarbverlauf, Voreinstellungen für WASD und nur Buchstaben, Hervorheben eines Wortes, gespeicherte Schemata, ANSI- und ISO-Layouts."
[[features]]
title = "Voreinstellungen auf Tastenkürzeln"
text = "Speichern Sie einen Look und schalten Sie mit einem globalen Tastenkürzel dorthin um, einschließlich F13–F24 mit Ctrl, Alt, Shift oder Win."
[[features]]
title = "Ein Tastenkürzel pro Gerät"
text = "Schaltet ein Gerät aus und wieder so ein, wie es war, zum Beispiel eine Zimmerlampe. Voreinstellungen bleiben unberührt."
[[features]]
title = "Folgt dem Bildschirm"
text = "Wird gedimmt, wenn Windows den Bildschirm dimmt, und geht aus, solange der Bildschirm aus ist: bei Inaktivität, gesperrt oder im Ruhezustand. Lässt sich abschalten."
[[features]]
title = "Funk und Akku"
text = "Akkustände, Warnungen bei 10 % und 5 % und der Status „No link“, solange ein Funkgerät schläft; seine Farben kommen beim Aufwachen zurück."
[[features]]
title = "Viele Geräte, getrennt gehalten"
text = "Identische Geräte haben eigene Einstellungen und werden an der Seriennummer unterschieden. Getrennte Geräte warten mit ihren Einstellungen in einem Archiv."
[[features]]
title = "Setup teilen"
text = "Alle Einstellungen exportieren und importieren oder eine Voreinstellung in eine Datei speichern: Sie wird auf die Geräte derselben Modelle des Empfängers angewendet."
[[features]]
title = "Updates mit einem Klick"
text = "Einmal am Tag fragt die App bei GitHub nach dem neuesten Release und zeigt eine Karte, die es installiert. Die Prüfung lässt sich abschalten."
[[features]]
title = "Passt zu Windows"
text = "Das Tray-Symbol zeigt die aktuelle Farbe, das Panel lässt sich im Vordergrund anheften, das Design folgt Windows, und die Oberfläche gibt es auf Englisch oder Russisch."

