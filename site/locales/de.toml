# limits
[[limits]]
head = "Nur Windows."
text = "Es ist eine App für Windows 10 und 11; es gibt keine Version für macOS oder Linux."
[[limits]]
head = "Nur Beleuchtung."
text = "Keine Makros, Tastenbelegung, Maus-DPI oder Firmware-Updates."
[[limits]]
head = "Nicht neben Beleuchtungs-Apps der Hersteller."
text = "Zwei Programme, die auf dasselbe Gerät schreiben, kommen sich in die Quere: Schließen Sie zuerst die Beleuchtungssoftware von G HUB, Synapse, Armoury Crate, SignalRGB oder OpenRGB."
[[limits]]
head = "Kein Konto und keine Cloud."
text = "Sie geht nur für die tägliche Update-Prüfung ins Internet, die sich abschalten lässt, und zu Tuya-Lampen in Ihrem eigenen Netzwerk."
[[limits]]
head = "Nicht jedes Modell ist getestet."
text = "Die meisten Razer-Modelle stammen aus den Daten von OpenRazer und sind ungetestet; kabellose HyperSpeed-Tastaturen funktionieren vorerst nur per Kabel."
[[limits]]
head = "Noch nicht signiert."
text = "Windows SmartScreen warnt beim ersten Mal möglicherweise vor dem Installationsprogramm; siehe Download weiter unten."

# claude_steps
[[claude_steps]]
title = "Repository in Claude Code öffnen"
text = "Klonen Sie auf dem Windows-PC, an dem das Gerät steckt, <code>github.com/Gronck2/rgb-tray</code> und starten Sie Claude Code in diesem Ordner. Für ein Profil genügen die Befehlszeilenwerkzeuge der installierten App; ein Treiber braucht Rust, und Claude hilft Ihnen bei der Installation."
[[claude_steps]]
title = "/add-device eingeben"
text = "Sagen Sie, um welches Gerät es sich handelt und was daran leuchtet. Schließen Sie vorher die App des Herstellers, damit nicht zwei Programme um das Gerät kämpfen."
[[claude_steps]]
title = "Claude liest den Gerätebericht"
text = "Es führt <code>rgbtray --diagnose</code> aus, findet Ihr Gerät an Hersteller- und Produkt-ID und sieht, welche seiner Schnittstellen ein Protokoll sprechen, das RGB Tray schon kennt."
[[claude_steps]]
title = "Es findet das Protokoll"
text = "In OpenRGB oder OpenRazer, in einem USB-Mitschnitt der Hersteller-App, den Sie aufnehmen (<a href=\"{{capture_doc_url}}\">so geht's</a>), oder durch vorsichtiges Ausprobieren mit <code>--hid-send</code>, jeweils eines und nur mit Ihrem Ja."
[[claude_steps]]
title = "Sie sind seine Augen"
text = "Es schreibt das Profil, prüft es mit <code>--profile-check</code> und spielt Farben, Zonen und Effekte mit <code>--profile-test</code> ab. Nach jedem Schritt fragt es, was das Gerät getan hat."
[[claude_steps]]
title = "Es funktioniert auf Ihrem PC"
text = "Claude kopiert das Profil nach <code>%APPDATA%\\rgbtray\\devices\\</code>; starten Sie RGB Tray neu, und das Gerät hat seine Karte im Panel. Dann fragt es, ob Sie es teilen möchten."

# routes
[[routes]]
title = "Es funktioniert schon"
text = "HID-LampArray-Geräte und QMK-Tastaturen mit VIA werden von generischen Treibern gesteuert. Öffnen Sie das Panel und suchen Sie die Karte."
[[routes]]
title = "Ein Profil für ein bekanntes Protokoll"
text = "Ein neues Razer-Modell ist eine kleine TOML-Datei mit seinen Produkt-IDs, der Transaktions-ID und den LED-IDs aus OpenRazer. Ein QMK/VIA-Profil kann die Effekte der Firmware benennen."
[[routes]]
title = "Ein <code>[hid]</code>-Profil"
text = "Ein einfaches Protokoll, Reports mit der Farbe darin und ohne nötige Antworten, wird als Report-Vorlagen mit <code>{r} {g} {b}</code> geschrieben. Es beherrscht auch XOR- oder Summen-Prüfsummen, Reports zum „Übernehmen“ und „Zurückgeben“ der Kontrolle und Farben pro LED. Kein Kompilieren."
[[routes]]
title = "Ein Rust-Treiber"
text = "Ein Protokoll, das Antworten, einen Handshake oder Zustand braucht, ist ein Treiber: ein Modul, das den <code>Device</code>-Trait implementiert. <a href=\"{{contributing_url}}\">CONTRIBUTING.md</a> führt Schritt für Schritt durch."

# commands
[[commands]]
cmd = "rgbtray --diagnose report.txt"
text = "Jedes HID-Gerät und jede Schnittstelle, die von RGB Tray erkannten markiert, und die Profildateien mit Fehlern."
[[commands]]
cmd = "rgbtray --hid-send out.txt <vid:pid[:page[:usage]]> <feature|output|get> \"<hex>\""
text = "Sendet rohe Reports und hängt die Antworten an die Datei an, um ein Protokoll zu ermitteln."
[[commands]]
cmd = "rgbtray --profile-check out.txt my-device.toml"
text = "Liest ein Profil, ohne ein Gerät anzusprechen, und schreibt, was die App aus jedem Modell macht oder was daran falsch ist."
[[commands]]
cmd = "rgbtray --profile-test out.txt my-device.toml"
text = "Spielt Rot, Grün, Blau, gedimmtes Weiß, jede Zone, Atmen, Spektrum und aus auf dem Gerät eines <code>[hid]</code>-Profils ab und protokolliert jeden Schritt."

# share_steps
[[share_steps]]
text = "Das Profil kommt nach <code>profiles/&lt;vendor&gt;-&lt;model&gt;.toml</code> und in <code>BUILT_IN</code> in <code>src/devices/profile.rs</code>, mit <code>tested = true</code> nur, wenn es am Gerät geprüft wurde."
[[share_steps]]
text = "Das Gerät kommt in die Tabellen jeder README."
[[share_steps]]
text = "Die Prüfungen der CI laufen durch: <code>cargo fmt --check</code>, <code>cargo clippy</code> und <code>cargo test</code>."
[[share_steps]]
text = "Ein Pull Request aus einem Branch Ihres Forks nennt, welches Gerät, welcher Weg und was an der Hardware geprüft wurde. Lieber nichts mit Git zu tun haben? Öffnen Sie eine Geräteanfrage und hängen Sie das Profil und den Gerätebericht an."

# install_steps
[[install_steps]]
text = "Laden Sie <code>RGBTray-Setup-&lt;version&gt;.exe</code> vom neuesten Release herunter."
[[install_steps]]
text = "Führen Sie die Datei aus. Sie installiert sich für Ihren Windows-Benutzer nach <code>%LOCALAPPDATA%\\Programs\\RGB Tray</code> und startet."
[[install_steps]]
text = "Klicken Sie auf das Tray-Symbol, um das Panel zu öffnen. RGB Tray entfernen Sie in den Windows-Einstellungen → Apps."
