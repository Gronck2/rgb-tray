models = "Naga V2 Pro, Mouse Dock Pro and about 90 more"
text = "Basilisk, DeathAdder, Viper, Cobra, BlackWidow, Huntsman, Ornata, Firefly, Goliathus, Base Station and others from OpenRazer's data: effects, zones of mice, battery. Most of them are untested; their card says so, and a report is welcome."
[[families]]
hue = "350"
title = "ASUS"
models = "Laptop keyboards (Aura)"
text = "Static, breathing, spectrum and off; the keyboard zones and the body lamps through LampArray. The keyboard resets itself to white on wake, so the lighting is applied again."
[[families]]
hue = "48"
