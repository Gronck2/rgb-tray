# features
[[features]]
title = "Brightness and speed"
text = "A global brightness with a per-device one on top of it; the speed of breathing and spectrum, global and per device."
[[features]]
title = "Per-key editor"
text = "For the Logitech keyboard: brush, eyedropper, rainbow, two-color gradient, WASD and letters-only presets, a highlighted word, saved schemes, ANSI and ISO layouts."
[[features]]
title = "Presets on hotkeys"
text = "Save a look and switch to it with a global hotkey, F13–F24 with Ctrl, Alt, Shift or Win included."
[[features]]
title = "A hotkey per device"
text = "Switches one device off and back on as it was, for example a room lamp. Presets are not affected."
[[features]]
title = "Follows the display"
text = "Dims when Windows dims the screen and goes off while the screen is off: idle, locked or asleep. Can be switched off."
[[features]]
title = "Wireless and battery"
text = "Battery levels, alerts at 10% and 5%, and a “No link” status while a wireless device sleeps; its colors come back when it wakes."
[[features]]
title = "Many devices, kept apart"
text = "Identical devices have their own settings, told apart by serial number. Disconnected ones wait in an archive with their settings."
[[features]]
title = "Share your setup"
text = "Export and import all settings, or save one preset to a file: it goes to the receiver's devices of the same models."
[[features]]
title = "Updates in one click"
text = "Once a day the app asks GitHub for the latest release and shows a card that installs it. The check can be switched off."
[[features]]
title = "Fits into Windows"
text = "The tray icon shows the current color, the panel can be pinned on top, the theme follows Windows, and the interface is in English or Russian."

