# limits
[[limits]]
head = "Windows only."
text = "It is a Windows 10 and 11 app; there is no macOS or Linux version."
[[limits]]
head = "Lighting only."
text = "No macros, key remapping, mouse DPI or firmware updates."
[[limits]]
head = "Not next to vendor lighting apps."
text = "Two programs writing to one device fight each other: close the lighting software of G HUB, Synapse, Armoury Crate, SignalRGB or OpenRGB first."
[[limits]]
head = "No account and no cloud."
text = "It goes online only for the daily update check, which can be switched off, and to Tuya bulbs on your own network."
[[limits]]
head = "Not every model is tested."
text = "Most of the Razer models come from OpenRazer's data and are untested; wireless HyperSpeed keyboards work on cable only for now."
[[limits]]
head = "Not code-signed yet."
text = "Windows SmartScreen may warn about the installer the first time; see Download below."

# claude_steps
[[claude_steps]]
title = "Open the repository in Claude Code"
text = "On the Windows PC the device is plugged into, clone <code>github.com/Gronck2/rgb-tray</code> and start Claude Code in that folder. For a profile, the installed app's command-line tools are enough; a driver needs Rust, and Claude helps you install it."
[[claude_steps]]
title = "Type /add-device"
text = "Say which device it is and what lights up on it. Quit the vendor's app first, so that two programs don't fight over the device."
[[claude_steps]]
title = "Claude reads the device report"
text = "It runs <code>rgbtray --diagnose</code>, finds your device by its vendor and product ids and sees which of its interfaces speak a protocol RGB Tray already knows."
[[claude_steps]]
title = "It finds the protocol"
text = "In OpenRGB or OpenRazer, in a USB capture of the vendor app that you record (<a href=\"{{capture_doc_url}}\">how</a>), or by careful tries with <code>--hid-send</code>, one at a time and only with your yes."
[[claude_steps]]
title = "You are its eyes"
text = "It writes the profile, checks it with <code>--profile-check</code> and plays colors, zones and effects with <code>--profile-test</code>. After each step it asks what the device did."
[[claude_steps]]
title = "It works on your PC"
text = "Claude copies the profile to <code>%APPDATA%\\rgbtray\\devices\\</code>; restart RGB Tray and the device has its card on the panel. Then it asks whether you want to share it."

# routes
[[routes]]
title = "It already works"
text = "HID LampArray devices and QMK keyboards with VIA are driven by generic drivers. Open the panel and look for the card."
[[routes]]
title = "A profile for a known protocol"
text = "A new Razer model is a small TOML file with its product ids, transaction id and LED ids, taken from OpenRazer. A QMK/VIA profile can name the firmware's effects."
[[routes]]
title = "A <code>[hid]</code> profile"
text = "A simple protocol, reports with the color in them and no answers needed, is written as report templates with <code>{r} {g} {b}</code>. It also does XOR or sum checksums, “take control” and “give back” reports and per-LED colors. No compiling."
[[routes]]
title = "A Rust driver"
text = "A protocol that needs answers, a handshake or state is a driver: a module that implements the <code>Device</code> trait. <a href=\"{{contributing_url}}\">CONTRIBUTING.md</a> walks through it."

# commands
[[commands]]
cmd = "rgbtray --diagnose report.txt"
text = "Every HID device and interface, the ones RGB Tray knows marked, and the profile files with mistakes."
[[commands]]
cmd = "rgbtray --hid-send out.txt <vid:pid[:page[:usage]]> <feature|output|get> \"<hex>\""
text = "Sends raw reports and appends the answers to the file, for working out a protocol."
[[commands]]
cmd = "rgbtray --profile-check out.txt my-device.toml"
text = "Reads a profile without touching any device and writes what the app makes of each model, or what is wrong with it."
[[commands]]
cmd = "rgbtray --profile-test out.txt my-device.toml"
text = "Plays red, green, blue, dim white, each zone, breathing, spectrum and off on the device of a <code>[hid]</code> profile, logging each step."

# share_steps
[[share_steps]]
text = "The profile goes to <code>profiles/&lt;vendor&gt;-&lt;model&gt;.toml</code> and into <code>BUILT_IN</code> in <code>src/devices/profile.rs</code>, with <code>tested = true</code> only if it was checked on the device."
[[share_steps]]
text = "The device goes into the tables of every README."
[[share_steps]]
text = "The checks CI runs pass: <code>cargo fmt --check</code>, <code>cargo clippy</code> and <code>cargo test</code>."
[[share_steps]]
text = "A pull request from a branch of your fork says which device, which route and what was checked on the hardware. Rather not deal with git? Open a device request and attach the profile and the device report."

# install_steps
[[install_steps]]
text = "Download <code>RGBTray-Setup-&lt;version&gt;.exe</code> from the latest release."
[[install_steps]]
text = "Run it. It installs itself for your Windows user into <code>%LOCALAPPDATA%\\Programs\\RGB Tray</code> and starts."
[[install_steps]]
text = "Click the tray icon to open the panel. RGB Tray is removed in Windows Settings → Apps."
