# Lists. In TOML every key after a [[table]] header belongs to that entry, so the lists come last.

# why
[[why]]
title = "Nothing else in the background"
text = "It speaks each device's protocol itself, so G HUB, Synapse, Armoury Crate or SignalRGB don't need to run. Installing takes no administrator rights."
[[why]]
title = "One panel for everything"
text = "A left click on the tray icon opens the panel: color, effect and brightness for all devices at once or per device, and presets you can put on global hotkeys."
[[why]]
title = "It keeps up with your PC"
text = "Lighting comes back after sleep (Modern Standby too) and when a device is plugged in, dims with the screen and goes off while the screen is off."

# families
[[families]]
hue = "205"
title = "Logitech"
models = "G915 TKL (LIGHTSPEED receiver)"
text = "Static, breathing, spectrum and off; per-key colors with a key editor; the wave and ripple effects of the firmware; battery."
[[families]]
hue = "135"
