# Lists. In TOML every key after a [[table]] header belongs to that entry, so the lists come last.

# why
[[why]]
title = "Rien d'autre en arrière-plan"
text = "Elle parle elle-même le protocole de chaque périphérique, donc G HUB, Synapse, Armoury Crate ou SignalRGB n'ont pas besoin de tourner. L'installation ne demande aucun droit d'administrateur."
[[why]]
title = "Un seul panneau pour tout"
text = "Un clic gauche sur l'icône de la zone de notification ouvre le panneau : couleur, effet et luminosité pour tous les périphériques à la fois ou un par un, et des préréglages que vous pouvez placer sur des raccourcis clavier globaux."
[[why]]
title = "Elle suit votre PC"
text = "L'éclairage revient après la mise en veille (y compris Modern Standby) et lorsqu'un périphérique est branché, baisse avec l'écran et s'éteint tant que l'écran est éteint."

