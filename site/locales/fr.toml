# features
[[features]]
title = "Luminosité et vitesse"
text = "Une luminosité globale à laquelle s'ajoute une luminosité par périphérique ; la vitesse de la respiration et du spectre, globale et par périphérique."
[[features]]
title = "Éditeur touche par touche"
text = "Pour le clavier Logitech : pinceau, pipette, arc-en-ciel, dégradé bicolore, préréglages WASD et lettres seules, mise en surbrillance d'un mot, schémas enregistrés, dispositions ANSI et ISO."
[[features]]
title = "Préréglages sur raccourcis clavier"
text = "Enregistrez un rendu et passez-y avec un raccourci clavier global, y compris F13–F24 avec Ctrl, Alt, Shift ou Win."
[[features]]
title = "Un raccourci par périphérique"
text = "Éteint un périphérique puis le rallume dans son état précédent, par exemple une lampe de pièce. Les préréglages ne sont pas affectés."
[[features]]
title = "Suit l'écran"
text = "Baisse quand Windows assombrit l'écran et s'éteint tant que l'écran est éteint : inactivité, verrouillage ou veille. Désactivable."
[[features]]
title = "Sans fil et batterie"
text = "Niveaux de batterie, alertes à 10 % et 5 %, et statut « No link » pendant qu'un périphérique sans fil est en veille ; ses couleurs reviennent à son réveil."
[[features]]
title = "Plusieurs périphériques, bien distincts"
text = "Les périphériques identiques ont leurs propres réglages, distingués par leur numéro de série. Les périphériques déconnectés attendent dans une archive avec leurs réglages."
[[features]]
title = "Partagez votre configuration"
text = "Exportez et importez tous les réglages, ou enregistrez un préréglage dans un fichier : il s'applique aux périphériques des mêmes modèles du destinataire."
[[features]]
title = "Mises à jour en un clic"
text = "Une fois par jour, l'application interroge GitHub sur la dernière version et affiche une carte qui l'installe. La vérification peut être désactivée."
[[features]]
title = "S'intègre à Windows"
text = "L'icône de la zone de notification affiche la couleur actuelle, le panneau peut être épinglé au premier plan, le thème suit celui de Windows, et l'interface est en anglais ou en russe."

