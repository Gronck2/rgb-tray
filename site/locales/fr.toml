# limits
[[limits]]
head = "Windows uniquement."
text = "C'est une application pour Windows 10 et 11 ; il n'existe pas de version macOS ni Linux."
[[limits]]
head = "Éclairage uniquement."
text = "Pas de macros, de réaffectation des touches, de DPI de souris ni de mises à jour du firmware."
[[limits]]
head = "Pas à côté des applications d'éclairage des constructeurs."
text = "Deux programmes qui écrivent sur le même périphérique se contrarient : fermez d'abord le logiciel d'éclairage de G HUB, Synapse, Armoury Crate, SignalRGB ou OpenRGB."
[[limits]]
head = "Ni compte ni cloud."
text = "Elle ne se connecte à Internet que pour la vérification quotidienne des mises à jour, qui peut être désactivée, et aux ampoules Tuya de votre propre réseau."
[[limits]]
head = "Tous les modèles ne sont pas testés."
text = "La plupart des modèles Razer viennent des données d'OpenRazer et n'ont pas été testés ; les claviers sans fil HyperSpeed ne fonctionnent pour l'instant qu'en filaire."
[[limits]]
head = "Pas encore signée."
text = "Windows SmartScreen peut afficher un avertissement à propos du programme d'installation la première fois ; voir Télécharger plus bas."

# claude_steps
[[claude_steps]]
title = "Ouvrez le dépôt dans Claude Code"
text = "Sur le PC Windows où le périphérique est branché, clonez <code>github.com/Gronck2/rgb-tray</code> et lancez Claude Code dans ce dossier. Pour un profil, les outils en ligne de commande de l'application installée suffisent ; un pilote nécessite Rust, et Claude vous aide à l'installer."
[[claude_steps]]
title = "Tapez /add-device"
text = "Dites de quel périphérique il s'agit et ce qui s'y allume. Quittez d'abord l'application du constructeur, pour que deux programmes ne se disputent pas le périphérique."
[[claude_steps]]
title = "Claude lit le rapport du périphérique"
text = "Il exécute <code>rgbtray --diagnose</code>, trouve votre périphérique grâce à ses identifiants de constructeur et de produit, et repère lesquelles de ses interfaces parlent un protocole que RGB Tray connaît déjà."
[[claude_steps]]
title = "Il trouve le protocole"
text = "Dans OpenRGB ou OpenRazer, dans une capture USB du logiciel constructeur que vous enregistrez (<a href=\"{{capture_doc_url}}\">comment faire</a>), ou par des essais prudents avec <code>--hid-send</code>, un à la fois et seulement avec votre accord."
[[claude_steps]]
title = "Vous êtes ses yeux"
text = "Il écrit le profil, le vérifie avec <code>--profile-check</code> et joue les couleurs, les zones et les effets avec <code>--profile-test</code>. Après chaque étape, il demande ce qu'a fait le périphérique."
[[claude_steps]]
title = "Ça fonctionne sur votre PC"
text = "Claude copie le profil dans <code>%APPDATA%\\rgbtray\\devices\\</code> ; redémarrez RGB Tray et le périphérique a sa carte sur le panneau. Il demande ensuite si vous voulez le partager."

# routes
[[routes]]
title = "Ça fonctionne déjà"
text = "Les périphériques HID LampArray et les claviers QMK avec VIA sont pilotés par des pilotes génériques. Ouvrez le panneau et cherchez la carte."
[[routes]]
title = "Un profil pour un protocole connu"
text = "Un nouveau modèle Razer est un petit fichier TOML avec ses identifiants de produit, l'identifiant de transaction et les identifiants de LED, tirés d'OpenRazer. Un profil QMK/VIA peut nommer les effets du firmware."
[[routes]]
title = "Un profil <code>[hid]</code>"
text = "Un protocole simple, des rapports contenant la couleur et sans réponse nécessaire, s'écrit sous forme de modèles de rapports avec <code>{r} {g} {b}</code>. Il gère aussi les sommes de contrôle XOR ou par somme, les rapports de « prise de contrôle » et de « restitution », et les couleurs par LED. Sans compilation."
[[routes]]
title = "Un pilote Rust"
text = "Un protocole qui nécessite des réponses, une poignée de main ou un état est un pilote : un module qui implémente le trait <code>Device</code>. <a href=\"{{contributing_url}}\">CONTRIBUTING.md</a> en détaille les étapes."

# commands
[[commands]]
cmd = "rgbtray --diagnose report.txt"
text = "Chaque périphérique et interface HID, ceux que RGB Tray connaît étant signalés, et les fichiers de profil contenant des erreurs."
[[commands]]
cmd = "rgbtray --hid-send out.txt <vid:pid[:page[:usage]]> <feature|output|get> \"<hex>\""
text = "Envoie des rapports bruts et ajoute les réponses au fichier, pour décortiquer un protocole."
[[commands]]
cmd = "rgbtray --profile-check out.txt my-device.toml"
text = "Lit un profil sans toucher à aucun périphérique et écrit ce que l'application comprend de chaque modèle, ou ce qui ne va pas."
[[commands]]
cmd = "rgbtray --profile-test out.txt my-device.toml"
text = "Joue rouge, vert, bleu, blanc atténué, chaque zone, respiration, spectre et éteint sur le périphérique d'un profil <code>[hid]</code>, en consignant chaque étape."

# share_steps
[[share_steps]]
text = "Le profil va dans <code>profiles/&lt;vendor&gt;-&lt;model&gt;.toml</code> et dans <code>BUILT_IN</code> de <code>src/devices/profile.rs</code>, avec <code>tested = true</code> seulement s'il a été vérifié sur le périphérique."
[[share_steps]]
text = "Le périphérique entre dans les tableaux de chaque README."
[[share_steps]]
text = "Les vérifications de la CI passent : <code>cargo fmt --check</code>, <code>cargo clippy</code> et <code>cargo test</code>."
[[share_steps]]
text = "Une pull request depuis une branche de votre fork indique quel périphérique, quelle voie et ce qui a été vérifié sur le matériel. Vous préférez éviter git ? Ouvrez une demande de périphérique et joignez le profil et le rapport du périphérique."

# install_steps
[[install_steps]]
text = "Téléchargez <code>RGBTray-Setup-&lt;version&gt;.exe</code> depuis la dernière version."
[[install_steps]]
text = "Lancez-le. Il s'installe pour votre utilisateur Windows dans <code>%LOCALAPPDATA%\\Programs\\RGB Tray</code> et démarre."
[[install_steps]]
text = "Cliquez sur l'icône de la zone de notification pour ouvrir le panneau. RGB Tray se désinstalle depuis Paramètres Windows → Applications."
