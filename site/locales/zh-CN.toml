# features
[[features]]
title = "亮度与速度"
text = "全局亮度，并可在其基础上为每个设备单独调节；呼吸和光谱循环的速度，可全局设置，也可按设备设置。"
[[features]]
title = "单键编辑器"
text = "适用于 Logitech 键盘：画笔、取色器、彩虹、双色渐变、WASD 和仅字母键预设、高亮单词、保存配色方案、ANSI 和 ISO 布局。"
[[features]]
title = "预设与快捷键"
text = "保存一种灯效，并用全局快捷键切换，支持 F13–F24 以及与 Ctrl、Alt、Shift 或 Win 的组合。"
[[features]]
title = "每个设备一个快捷键"
text = "关闭某个设备的灯光并按原样重新打开，例如用于房间灯。不影响预设。"
[[features]]
title = "跟随显示器"
text = "Windows 调暗屏幕时灯光随之变暗，屏幕关闭时（空闲、锁定或睡眠）灯光熄灭。可以关闭此功能。"
[[features]]
title = "无线与电量"
text = "电量显示、10% 和 5% 时提醒，无线设备休眠时显示“No link”（无连接）状态；设备唤醒后颜色会恢复。"
[[features]]
title = "多个设备，互不干扰"
text = "相同的设备各自拥有独立设置，通过序列号区分。断开连接的设备连同其设置保存在归档中等候。"
[[features]]
title = "分享你的设置"
text = "导出和导入全部设置，或将单个预设保存为文件：它会应用到接收方相同型号的设备上。"
[[features]]
title = "一键更新"
text = "应用每天向 GitHub 查询一次最新版本，并显示一张可一键安装的卡片。可以关闭此检查。"
[[features]]
title = "融入 Windows"
text = "托盘图标显示当前颜色，面板可固定在最上层，主题跟随 Windows，界面提供英文和俄文。"

