# limits
[[limits]]
head = "仅限 Windows。"
text = "这是 Windows 10 和 11 的应用；没有 macOS 或 Linux 版本。"
[[limits]]
head = "仅管灯效。"
text = "不支持宏、按键映射、鼠标 DPI 或固件更新。"
[[limits]]
head = "不能与厂商灯效软件并存。"
text = "两个程序同时写入同一设备会相互冲突：请先关闭 G HUB、Synapse、Armoury Crate、SignalRGB 或 OpenRGB 的灯效软件。"
[[limits]]
head = "无需账号，不用云端。"
text = "它只在每日检查更新时联网（可以关闭），以及连接你自己网络中的 Tuya 灯泡时联网。"
[[limits]]
head = "并非每个型号都经过测试。"
text = "大多数 Razer 型号来自 OpenRazer 的数据，未经测试；HyperSpeed 无线键盘目前仅支持有线连接。"
[[limits]]
head = "尚未进行代码签名。"
text = "Windows SmartScreen 首次运行时可能会对安装程序发出警告；见下方的下载部分。"

# claude_steps
[[claude_steps]]
title = "在 Claude Code 中打开仓库"
text = "在插着该设备的 Windows 电脑上，克隆 <code>github.com/Gronck2/rgb-tray</code>，并在该文件夹中启动 Claude Code。配置文件只需已安装应用的命令行工具；驱动则需要 Rust，Claude 会帮你安装。"
[[claude_steps]]
title = "输入 /add-device"
text = "说明是哪个设备，以及它上面哪里会亮。请先退出厂商的应用，以免两个程序争抢设备。"
[[claude_steps]]
title = "Claude 读取设备报告"
text = "它会运行 <code>rgbtray --diagnose</code>，按厂商 ID 和产品 ID 找到你的设备，并查看其哪些接口使用的是 RGB Tray 已知的协议。"
[[claude_steps]]
title = "它查找协议"
text = "在 OpenRGB 或 OpenRazer 中查找，或查看你录制的厂商应用 USB 抓包（<a href=\"{{capture_doc_url}}\">方法</a>），或用 <code>--hid-send</code> 小心地逐条尝试，且只在你同意之后进行。"
[[claude_steps]]
title = "你就是它的眼睛"
text = "它编写配置文件，用 <code>--profile-check</code> 检查，并用 <code>--profile-test</code> 播放颜色、分区和灯效。每一步之后，它都会询问设备的反应。"
[[claude_steps]]
title = "它在你的电脑上正常工作"
text = "Claude 把配置文件复制到 <code>%APPDATA%\\rgbtray\\devices\\</code>；重启 RGB Tray，设备就会在面板上出现自己的卡片。然后它会询问你是否想分享出去。"

# routes
[[routes]]
title = "已经可以使用"
text = "HID LampArray 设备和支持 VIA 的 QMK 键盘由通用驱动控制。打开面板，找找它的卡片。"
[[routes]]
title = "已知协议的配置文件"
text = "新的 Razer 型号只需一个小的 TOML 文件，写明其产品 ID、事务 ID 和 LED ID，这些都取自 OpenRazer。QMK/VIA 配置文件可以指定固件的灯效。"
[[routes]]
title = "<code>[hid]</code> 配置文件"
text = "简单的协议（报告里带颜色，无需应答）可以写成带有 <code>{r} {g} {b}</code> 的报告模板。它还支持 XOR 或求和校验、“接管”和“交还”报告以及按 LED 设置颜色。无需编译。"
[[routes]]
title = "Rust 驱动"
text = "需要应答、握手或状态的协议要用驱动：即实现 <code>Device</code> trait 的模块。<a href=\"{{contributing_url}}\">CONTRIBUTING.md</a> 对此有详细说明。"

# commands
[[commands]]
cmd = "rgbtray --diagnose report.txt"
text = "列出所有 HID 设备和接口，标出 RGB Tray 认识的设备，以及有错误的配置文件。"
[[commands]]
cmd = "rgbtray --hid-send out.txt <vid:pid[:page[:usage]]> <feature|output|get> \"<hex>\""
text = "发送原始报告并将应答追加到文件中，用于分析协议。"
[[commands]]
cmd = "rgbtray --profile-check out.txt my-device.toml"
text = "读取配置文件而不访问任何设备，并写出应用对其中每个型号的解析结果，或其中的错误。"
[[commands]]
cmd = "rgbtray --profile-test out.txt my-device.toml"
text = "在 <code>[hid]</code> 配置文件所对应的设备上依次播放红、绿、蓝、暗白、各个分区、呼吸、光谱循环和关闭，并记录每一步。"

# share_steps
[[share_steps]]
text = "配置文件放入 <code>profiles/&lt;vendor&gt;-&lt;model&gt;.toml</code>，并加入 <code>src/devices/profile.rs</code> 中的 <code>BUILT_IN</code>；只有在设备上实际检查过，才设置 <code>tested = true</code>。"
[[share_steps]]
text = "设备要加入每个 README 的表格。"
[[share_steps]]
text = "通过 CI 运行的检查：<code>cargo fmt --check</code>、<code>cargo clippy</code> 和 <code>cargo test</code>。"
[[share_steps]]
text = "从你的 fork 的某个分支提交 pull request，说明是哪个设备、采用哪种方式，以及在硬件上检查了什么。不想折腾 git？提交一份设备申请，附上配置文件和设备报告即可。"

# install_steps
[[install_steps]]
text = "从最新版本下载 <code>RGBTray-Setup-&lt;version&gt;.exe</code>。"
[[install_steps]]
text = "运行它。应用会为当前 Windows 用户安装到 <code>%LOCALAPPDATA%\\Programs\\RGB Tray</code> 并启动。"
[[install_steps]]
text = "单击托盘图标即可打开面板。可在 Windows 设置 → 应用中卸载 RGB Tray。"
