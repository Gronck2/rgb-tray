# Lists. In TOML every key after a [[table]] header belongs to that entry, so the lists come last.

# why
[[why]]
title = "后台不再运行其他软件"
text = "它自己掌握每个设备的协议，因此 G HUB、Synapse、Armoury Crate 或 SignalRGB 都不需要运行。安装无需管理员权限。"
[[why]]
title = "一个面板管理一切"
text = "左键单击托盘图标即可打开面板：颜色、灯效和亮度，可一次性设置全部设备，也可逐个设置，还有可绑定全局快捷键的预设。"
[[why]]
title = "跟得上你的电脑"
text = "睡眠（包括 Modern Standby）唤醒后以及插入设备时灯效会自动恢复，灯光随屏幕变暗，屏幕关闭时熄灭。"

