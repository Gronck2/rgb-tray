# features
[[features]]
title = "明るさと速度"
text = "全体の明るさに加えて、その上にデバイスごとの明るさを設定可能。ブリージングとスペクトラムの速度も、全体およびデバイスごとに設定できます。"
[[features]]
title = "キーごとのエディター"
text = "Logitech キーボード用：ブラシ、スポイト、レインボー、2 色グラデーション、WASD のみ・文字キーのみのプリセット、単語のハイライト、スキームの保存、ANSI/ISO 配列。"
[[features]]
title = "ホットキーでプリセット"
text = "ライティングを保存し、グローバルホットキーで切り替えられます。Ctrl、Alt、Shift、Win と組み合わせた F13–F24 も使えます。"
[[features]]
title = "デバイスごとのホットキー"
text = "1 台のデバイスを消灯し、元の状態で再点灯します。たとえば部屋のランプに便利です。プリセットには影響しません。"
[[features]]
title = "ディスプレイに連動"
text = "Windows が画面を暗くするとライティングも暗くなり、画面がオフの間（アイドル、ロック、スリープ）は消灯します。オフにすることもできます。"
[[features]]
title = "ワイヤレスとバッテリー"
text = "バッテリー残量の表示、10% と 5% での警告、ワイヤレスデバイスのスリープ中は「No link」（接続なし）と表示。復帰すると色が戻ります。"
[[features]]
title = "複数のデバイスを区別して管理"
text = "同じデバイスでもそれぞれ個別に設定でき、シリアル番号で区別されます。切断されたデバイスは設定ごとアーカイブで待機します。"
[[features]]
title = "設定を共有"
text = "すべての設定をエクスポート／インポートできます。プリセット 1 つをファイルに保存することもでき、受け取った側の同じモデルのデバイスに適用されます。"
[[features]]
title = "ワンクリックでアップデート"
text = "1 日 1 回 GitHub に最新リリースを問い合わせ、インストールできるカードを表示します。チェックはオフにできます。"
[[features]]
title = "Windows になじむ"
text = "トレイアイコンが現在の色を表示し、パネルは最前面にピン留めでき、テーマは Windows に追従し、インターフェースは英語とロシア語です。"

