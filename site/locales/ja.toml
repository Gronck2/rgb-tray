# Lists. In TOML every key after a [[table]] header belongs to that entry, so the lists come last.

# why
[[why]]
title = "バックグラウンドに他は不要"
text = "各デバイスのプロトコルを自分で話すため、G HUB、Synapse、Armoury Crate、SignalRGB を動かしておく必要はありません。インストールに管理者権限は不要です。"
[[why]]
title = "すべてを 1 つのパネルで"
text = "トレイアイコンを左クリックするとパネルが開きます。色、エフェクト、明るさを全デバイス一括またはデバイスごとに設定でき、グローバルホットキーに割り当てられるプリセットもあります。"
[[why]]
title = "PC の状態に追従"
text = "スリープ（モダン スタンバイを含む）からの復帰時やデバイスの接続時にライティングが戻り、画面に合わせて暗くなり、画面がオフの間は消灯します。"

