# limits
[[limits]]
head = "Windows 専用。"
text = "Windows 10 と 11 用のアプリで、macOS や Linux 版はありません。"
[[limits]]
head = "ライティングのみ。"
text = "マクロ、キーの割り当て変更、マウスの DPI、ファームウェア更新には対応しません。"
[[limits]]
head = "メーカー製ライティングアプリとは併用不可。"
text = "2 つのプログラムが同じデバイスに書き込むと互いに競合します。先に G HUB、Synapse、Armoury Crate、SignalRGB、OpenRGB のライティングソフトウェアを終了してください。"
[[limits]]
head = "アカウントもクラウドも不要。"
text = "インターネットに接続するのは、毎日のアップデート確認（オフにできます）と、同じネットワーク内の Tuya 電球への通信だけです。"
[[limits]]
head = "すべてのモデルを検証しているわけではありません。"
text = "Razer のモデルの大半は OpenRazer のデータに基づく未検証のもので、ワイヤレスの HyperSpeed キーボードは現在のところ有線接続時のみ動作します。"
[[limits]]
head = "まだコード署名がありません。"
text = "Windows SmartScreen が初回にインストーラーを警告することがあります。下のダウンロードを参照してください。"

# claude_steps
[[claude_steps]]
title = "Claude Code でリポジトリを開く"
text = "デバイスをつないだ Windows PC で <code>github.com/Gronck2/rgb-tray</code> をクローンし、そのフォルダーで Claude Code を起動します。プロファイルならインストール済みアプリのコマンドラインツールで足ります。ドライバーには Rust が必要で、Claude がインストールを手伝います。"
[[claude_steps]]
title = "/add-device と入力"
text = "どのデバイスか、どこが光るのかを伝えます。2 つのプログラムがデバイスを奪い合わないよう、先にメーカー製アプリを終了してください。"
[[claude_steps]]
title = "Claude がデバイスレポートを読む"
text = "<code>rgbtray --diagnose</code> を実行し、ベンダー ID とプロダクト ID からデバイスを見つけ、RGB Tray がすでに知っているプロトコルを話すインターフェースがどれかを調べます。"
[[claude_steps]]
title = "プロトコルを探す"
text = "OpenRGB や OpenRazer の中、あなたが記録したメーカー製アプリの USB キャプチャ（<a href=\"{{capture_doc_url}}\">手順</a>）、または <code>--hid-send</code> による慎重な試行で探します。試行は 1 回ずつ、あなたの了承を得てからのみです。"
[[claude_steps]]
title = "あなたが Claude の目になる"
text = "プロファイルを書き、<code>--profile-check</code> で確認し、<code>--profile-test</code> で色、ゾーン、エフェクトを再生します。各ステップのあとで、デバイスがどう反応したかを尋ねます。"
[[claude_steps]]
title = "あなたの PC で動く"
text = "Claude がプロファイルを <code>%APPDATA%\\rgbtray\\devices\\</code> にコピーします。RGB Tray を再起動すると、デバイスのカードがパネルに表示されます。そのあと、共有したいかどうかを尋ねます。"

# routes
[[routes]]
title = "すでに動く"
text = "HID LampArray デバイスと、VIA 対応の QMK キーボードは、汎用ドライバーで制御されます。パネルを開いてカードを探してください。"
[[routes]]
title = "既知のプロトコル用のプロファイル"
text = "新しい Razer モデルは、プロダクト ID、トランザクション ID、LED ID を記した小さな TOML ファイルです。値は OpenRazer から取ります。QMK/VIA のプロファイルではファームウェアのエフェクトを指定できます。"
[[routes]]
title = "<code>[hid]</code> プロファイル"
text = "単純なプロトコル（色を含むレポートで、応答が不要なもの）は、<code>{r} {g} {b}</code> を使ったレポートテンプレートとして記述します。XOR や合計のチェックサム、「制御を取得」「制御を返す」レポート、LED ごとの色にも対応します。コンパイル不要です。"
[[routes]]
title = "Rust ドライバー"
text = "応答、ハンドシェイク、状態が必要なプロトコルにはドライバーを使います。<code>Device</code> トレイトを実装するモジュールです。手順は <a href=\"{{contributing_url}}\">CONTRIBUTING.md</a> で説明しています。"

# commands
[[commands]]
cmd = "rgbtray --diagnose report.txt"
text = "すべての HID デバイスとインターフェースを一覧にし、RGB Tray が認識するものに印を付け、誤りのあるプロファイルファイルも示します。"
[[commands]]
cmd = "rgbtray --hid-send out.txt <vid:pid[:page[:usage]]> <feature|output|get> \"<hex>\""
text = "生のレポートを送信し、応答をファイルに追記します。プロトコルを解析するためのものです。"
[[commands]]
cmd = "rgbtray --profile-check out.txt my-device.toml"
text = "デバイスに一切触れずにプロファイルを読み込み、各モデルがアプリにどう解釈されるか、または何が間違っているかを書き出します。"
[[commands]]
cmd = "rgbtray --profile-test out.txt my-device.toml"
text = "<code>[hid]</code> プロファイルのデバイスで、赤、緑、青、暗めの白、各ゾーン、ブリージング、スペクトラム、消灯を再生し、各ステップを記録します。"

# share_steps
[[share_steps]]
text = "プロファイルは <code>profiles/&lt;vendor&gt;-&lt;model&gt;.toml</code> に置き、<code>src/devices/profile.rs</code> の <code>BUILT_IN</code> に追加します。<code>tested = true</code> にするのは、実機で確認した場合のみです。"
[[share_steps]]
text = "デバイスをすべての README の表に追加します。"
[[share_steps]]
text = "CI が実行するチェックを通します：<code>cargo fmt --check</code>、<code>cargo clippy</code>、<code>cargo test</code>。"
[[share_steps]]
text = "フォークのブランチからプルリクエストを出し、どのデバイスか、どの方法か、ハードウェアで何を確認したかを書きます。git は避けたい？ デバイスリクエストを開き、プロファイルとデバイスレポートを添付してください。"

# install_steps
[[install_steps]]
text = "最新リリースから <code>RGBTray-Setup-&lt;version&gt;.exe</code> をダウンロードします。"
[[install_steps]]
text = "実行します。現在の Windows ユーザー向けに <code>%LOCALAPPDATA%\\Programs\\RGB Tray</code> へ自身をインストールし、起動します。"
[[install_steps]]
text = "トレイアイコンをクリックするとパネルが開きます。RGB Tray は Windows の設定 → アプリから削除できます。"
