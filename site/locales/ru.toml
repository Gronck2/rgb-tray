# features
[[features]]
title = "Яркость и скорость"
text = "Общая яркость и яркость каждого устройства поверх неё; скорость дыхания и спектра — общая и для каждого устройства."
[[features]]
title = "Цвета клавиш"
text = "Для клавиатуры Logitech: кисть, пипетка, радуга, двухцветный градиент, WASD и «только буквы», подсветка слова, сохранённые схемы, раскладки ANSI и ISO."
[[features]]
title = "Пресеты на горячих клавишах"
text = "Сохраните вид и переключайтесь на него глобальной горячей клавишей, в том числе F13–F24 с Ctrl, Alt, Shift или Win."
[[features]]
title = "Горячая клавиша для устройства"
text = "Выключает одно устройство и включает обратно как было — например, лампу в комнате. Пресеты от этого не меняются."
[[features]]
title = "Следует за экраном"
text = "Притухает, когда Windows затемняет экран, и гаснет, пока экран выключен: простой, блокировка или сон. Можно отключить."
[[features]]
title = "Беспроводные и батарея"
text = "Заряд батареи, оповещения при 10% и 5% и статус «Нет связи», пока беспроводное устройство спит; при пробуждении цвета возвращаются."
[[features]]
title = "Много устройств, у каждого своё"
text = "У одинаковых устройств свои настройки: они различаются по серийному номеру. Отключённые ждут в архиве вместе с настройками."
[[features]]
title = "Делитесь настройками"
text = "Экспорт и импорт всех настроек или один пресет в файл: он достаётся устройствам получателя тех же моделей."
[[features]]
title = "Обновления в один щелчок"
text = "Раз в день приложение спрашивает у GitHub последний релиз и показывает карточку, которая его ставит. Проверку можно отключить."
[[features]]
title = "Свой в Windows"
text = "Значок в трее показывает текущий цвет, панель можно закрепить поверх окон, тема следует за Windows, интерфейс — на русском или английском."

