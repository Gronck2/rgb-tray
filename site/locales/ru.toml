# limits
[[limits]]
head = "Только Windows."
text = "Это приложение для Windows 10 и 11; версий для macOS и Linux нет."
[[limits]]
head = "Только подсветка."
text = "Никаких макросов, переназначения клавиш, DPI мыши и обновлений прошивки."
[[limits]]
head = "Не вместе с фирменными программами подсветки."
text = "Две программы, пишущие в одно устройство, мешают друг другу: сначала закройте подсветку G HUB, Synapse, Armoury Crate, SignalRGB или OpenRGB."
[[limits]]
head = "Без аккаунта и облака."
text = "В сеть приложение ходит только за ежедневной проверкой обновлений (её можно отключить) и к лампам Tuya в вашей собственной сети."
[[limits]]
head = "Не каждая модель проверена."
text = "Большинство моделей Razer взяты из данных OpenRazer и не проверялись; беспроводные клавиатуры HyperSpeed пока работают только по кабелю."
[[limits]]
head = "Пока без подписи кода."
text = "При первом запуске установщика SmartScreen может показать предупреждение; см. «Скачать» ниже."

# claude_steps
[[claude_steps]]
title = "Откройте репозиторий в Claude Code"
text = "На компьютере с Windows, к которому подключено устройство, склонируйте <code>github.com/Gronck2/rgb-tray</code> и запустите Claude Code в этой папке. Для профиля хватит инструментов командной строки установленного приложения; для драйвера нужен Rust, и Claude поможет его поставить."
[[claude_steps]]
title = "Наберите /add-device"
text = "Скажите, что это за устройство и что на нём светится. Сначала закройте фирменную программу, чтобы две программы не спорили за устройство."
[[claude_steps]]
title = "Claude читает отчёт об устройствах"
text = "Он запускает <code>rgbtray --diagnose</code>, находит ваше устройство по идентификаторам производителя и продукта и смотрит, какие из его интерфейсов говорят на уже знакомом RGB Tray протоколе."
[[claude_steps]]
title = "Находит протокол"
text = "В OpenRGB или OpenRazer, в записи USB-обмена фирменной программы, которую сделаете вы (<a href=\"{{capture_doc_url}}\">как</a>), или осторожными пробами через <code>--hid-send</code> — по одной и только с вашего согласия."
[[claude_steps]]
title = "Вы — его глаза"
text = "Он пишет профиль, проверяет его через <code>--profile-check</code> и проигрывает цвета, зоны и эффекты через <code>--profile-test</code>. После каждого шага спрашивает, что сделало устройство."
[[claude_steps]]
title = "Работает у вас"
text = "Claude копирует профиль в <code>%APPDATA%\\rgbtray\\devices\\</code>; перезапустите RGB Tray, и у устройства появится карточка на панели. Потом он спросит, хотите ли вы поделиться им."

# routes
[[routes]]
title = "Уже работает"
text = "Устройствами HID LampArray и клавиатурами QMK с VIA управляют общие драйверы. Откройте панель и найдите карточку."
[[routes]]
title = "Профиль для знакомого протокола"
text = "Новая модель Razer — небольшой TOML-файл с её идентификаторами продукта, transaction id и номерами светодиодов из OpenRazer. Профиль QMK/VIA может назвать эффекты прошивки."
[[routes]]
title = "Профиль <code>[hid]</code>"
text = "Простой протокол — отчёты с цветом внутри, без ответов устройства — записывается шаблонами отчётов с <code>{r} {g} {b}</code>. Умеет контрольные суммы XOR и суммой, отчёты «взять управление» и «вернуть», цвета отдельных светодиодов. Без компиляции."
[[routes]]
title = "Драйвер на Rust"
text = "Протокол, которому нужны ответы, рукопожатие или состояние, — это драйвер: модуль, реализующий трейт <code>Device</code>. Как его написать, рассказывает <a href=\"{{contributing_url}}\">CONTRIBUTING.ru.md</a>."

# commands
[[commands]]
cmd = "rgbtray --diagnose report.txt"
text = "Все HID-устройства и интерфейсы с пометками о тех, что знает RGB Tray, и файлы профилей с ошибками."
[[commands]]
cmd = "rgbtray --hid-send out.txt <vid:pid[:page[:usage]]> <feature|output|get> \"<hex>\""
text = "Отправляет сырые отчёты и дописывает ответы в файл — чтобы разобраться в протоколе."
[[commands]]
cmd = "rgbtray --profile-check out.txt my-device.toml"
text = "Читает профиль, не трогая устройства, и пишет, что приложение поняло о каждой модели или что в нём не так."
[[commands]]
cmd = "rgbtray --profile-test out.txt my-device.toml"
text = "Проигрывает красный, зелёный, синий, тусклый белый, каждую зону, дыхание, спектр и выкл. на устройстве профиля <code>[hid]</code> и пишет каждый шаг в журнал."

# share_steps
[[share_steps]]
text = "Профиль ложится в <code>profiles/&lt;vendor&gt;-&lt;model&gt;.toml</code> и в <code>BUILT_IN</code> в <code>src/devices/profile.rs</code>, с <code>tested = true</code> только если его проверили на устройстве."
[[share_steps]]
text = "Устройство добавляется в таблицы всех README."
[[share_steps]]
text = "Проходят проверки CI: <code>cargo fmt --check</code>, <code>cargo clippy</code> и <code>cargo test</code>."
[[share_steps]]
text = "В pull request'е из ветки вашего форка написано, какое устройство, каким путём и что проверено на железе. Не хочется связываться с git? Откройте запрос устройства и приложите профиль и отчёт об устройствах."

# install_steps
[[install_steps]]
text = "Скачайте <code>RGBTray-Setup-&lt;версия&gt;.exe</code> из последнего релиза."
[[install_steps]]
text = "Запустите. Приложение установится для вашего пользователя Windows в <code>%LOCALAPPDATA%\\Programs\\RGB Tray</code> и запустится."
[[install_steps]]
text = "Щелчок по значку в трее открывает панель. Удаляется RGB Tray в Параметрах Windows → Приложения."
