# why
[[why]]
title = "Ничего лишнего в фоне"
text = "Приложение само говорит на протоколе каждого устройства, поэтому G HUB, Synapse, Armoury Crate и SignalRGB запускать не нужно. Для установки не нужны права администратора."
[[why]]
title = "Одна панель для всего"
text = "Щелчок по значку в трее открывает панель: цвет, эффект и яркость сразу для всех устройств или для каждого, и пресеты на глобальных горячих клавишах."
[[why]]
title = "Успевает за компьютером"
text = "Подсветка возвращается после сна (и Modern Standby) и при подключении устройства, притухает вместе с экраном и гаснет, пока экран выключен."

